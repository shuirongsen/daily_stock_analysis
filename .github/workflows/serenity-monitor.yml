name: Serenity Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '1-59/5 * * * *'
    - cron: '2-59/5 * * * *'
    - cron: '3-59/5 * * * *'
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          QQ_EMAIL:       ${{ secrets.QQ_EMAIL }}
          QQ_EMAIL_PASS:  ${{ secrets.QQ_EMAIL_PASS }}
        run: python serenity_monitor.py
