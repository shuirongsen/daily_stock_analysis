name: Serenity Monitor

on:
  schedule:
    - cron: '0/5 * * * *'
    - cron: '1/5 * * * *'
    - cron: '2/5 * * * *'
    - cron: '3/5 * * * *'
    - cron: '4/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-serenity-v1

      - name: Install dependencies
        run: pip install "twikit>=2.0" requests

      - name: Run monitor
        env:
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
          PUSHPLUS_TOKEN:  ${{ secrets.PUSHPLUS_TOKEN }}
          QQ_EMAIL:        ${{ secrets.QQ_EMAIL }}
          QQ_EMAIL_PASS:   ${{ secrets.QQ_EMAIL_PASS }}
        run: python serenity_monitor.py
